async function callFn(body, withSession) {
  const headers = { 'Content-Type': 'application/json', apikey: SUPABASE_KEY };
  if (withSession) {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) throw new Error('Ingresá de nuevo.');
    headers.Authorization = 'Bearer ' + session.access_token;
  }
  let res;
  try { res = await fetch(FN_URL, { method: 'POST', headers, body: JSON.stringify(body) }); }
  catch (e) { throw new Error('Sin conexión. Revisá tu internet.'); }
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || 'No se pudo completar la acción.');
  return j;
}

let toastTimer;
function toast(msg, bad) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = ''; }, 2800);
}
function friendly(e) {
  const m = (e && e.message) || String(e);
  const map = [
    [/Invalid login credentials/i, 'Usuario o contraseña incorrectos.'],
    [/already registered/i, 'Ese email ya tiene cuenta. Ingresá desde la pestaña "Ingresar".'],
    [/Email not confirmed/i, 'Primero confirmá tu email (revisá tu casilla).'],
    [/at least 6/i, 'La contraseña debe tener al menos 6 caracteres.'],
    [/Database error saving new user/i, 'No se pudo crear la cuenta. Revisá el código de profe.'],
    [/rate limit|too many/i, 'Demasiados intentos. Esperá un rato y probá de nuevo.'],
    [/Unable to validate email|invalid format/i, 'El email no es válido.'],
    [/Failed to fetch|NetworkError|Load failed/i, 'Sin conexión. Revisá tu internet.']
  ];
  for (const [re, t] of map) if (re.test(m)) return t;
  if (e && e.code === '23503') return 'No se puede borrar: se está usando en una rutina.';
  return m;
}
function handleErr(e) { console.error(e); toast(friendly(e), true); }

function ytId(u) {
  if (!u) return null;
  const m = String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);
  return m ? m[1] : null;
}
function videoBlock(url) {
  if (!url) return '';
  const id = ytId(url);
  if (id) return `<div class="video" data-act="playVideo" data-id="${id}"><img loading="lazy" src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="Video del ejercicio"><span class="play"><i></i></span></div>`;
  if (/^https?:\/\//i.test(url)) return `<a class="link" href="${esc(url)}" target="_blank" rel="noopener">Ver video</a>`;
  return '';
}
function groupLogs(logs) {
  const m = new Map();
  logs.forEach(l => { if (!m.has(l.performed_on)) m.set(l.performed_on, []); m.get(l.performed_on).push(l); });
  return [...m.entries()];
}
function sessionsHtml(logs, limit) {
  const ss = groupLogs(logs).slice(0, limit || 14);
  if (!ss.length) return '<div class="empty">Todavía no hay entrenamientos registrados.</div>';
  return ss.map(([date, arr]) => `<details class="card sess"><summary><b>${esc(fmtDate(date))}</b> <span class="muted">· ${arr.length} ejercicio(s)</span></summary>${arr.map(l => {
    const det = [l.weight_used, l.reps_done ? 'reps ' + l.reps_done : ''].filter(Boolean).join(' · ') || '—';
    const nm = (l.routine_items && l.routine_items.exercises && l.routine_items.exercises.name) || 'Ejercicio';
    return `<div class="logline"><span>${esc(nm)}</span><span class="muted">${esc(det)}</span></div>`;
  }).join('')}</details>`).join('');
}

  try { const L = loaders()[S.view.name]; if (L) await L(S.view); } catch (e) { handleErr(e); }

}

/* ===== BARRA INFERIOR: la lente se desliza entre pestañas ===== */
// La barra se vuelve a dibujar en cada cambio, así que se mide dónde estaba la lente
// (aunque estuviera a mitad de camino) y se la anima desde ahí hasta su lugar nuevo.
function lensLeft() { const l = app.querySelector('nav.tabs .lens'); return l ? l.getBoundingClientRect().left : null; }
function slideLens(desde, cantidad) {
  const nav = app.querySelector('nav.tabs'); if (!nav || desde == null) return;
  const lens = nav.querySelector('.lens');
  if (!lens || !lens.animate || nav.querySelectorAll('button').length !== cantidad) return;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const dx = desde - lens.getBoundingClientRect().left;
  if (Math.abs(dx) < 1) return;
  lens.animate(
    [{ transform: `translateX(${dx}px) scale(1.1,1.06)` }, { transform: 'translateX(0) scale(1,1)' }],
    { duration: 460, easing: 'cubic-bezier(.25,1.1,.4,1)' }
  );
}

  const tope = (s, v) => Math.max(0, Math.min(s.bs.length - 1, Math.round(v)));
  document.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    const b = e.target.closest && e.target.closest('nav.tabs button.on'); if (!b) return;
    const nav = b.parentNode, lens = nav.querySelector('.lens'), bs = [...nav.querySelectorAll('button')];
    if (!lens || bs.length < 2) return;
    st = { nav, lens, bs, cur: bs.indexOf(b), id: e.pointerId, x0: e.clientX, dx: 0, drag: false,
      paso: bs[1].getBoundingClientRect().left - bs[0].getBoundingClientRect().left };
  });
  document.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.id) return;
    const d = e.clientX - st.x0;
    if (!st.drag) {
      if (Math.abs(d) < 8) return;
      st.drag = true; st.nav.classList.add('drag');
      try { st.nav.setPointerCapture(st.id); } catch (_) {}
    }
    st.dx = Math.max(-st.cur * st.paso, Math.min((st.bs.length - 1 - st.cur) * st.paso, d));
    st.lens.style.transition = 'none';
    st.lens.style.transform = `translateX(${st.dx}px) scale(1.1,1.06)`;
    const hot = tope(st, st.cur + st.dx / st.paso);
    st.bs.forEach((b, i) => b.classList.toggle('hot', i === hot));
  });
  const soltar = e => {
    if (!st || e.pointerId !== st.id) return;
    const s = st; st = null;
    if (!s.drag) return;
    arrastro = true; setTimeout(() => { arrastro = false; }, 400);
    s.nav.classList.remove('drag');
    s.bs.forEach(b => b.classList.remove('hot'));
    const idx = tope(s, s.cur + s.dx / s.paso);
    if (e.type === 'pointerup' && idx !== s.cur) s.bs[idx].click();
    else {
      s.lens.style.transition = 'transform .38s cubic-bezier(.25,1.1,.4,1)';
      s.lens.style.transform = '';
    }
  };
  document.addEventListener('pointerup', soltar);
  document.addEventListener('pointercancel', soltar);
  // El toque que llega justo después de arrastrar no debe contar como un toque en una pestaña.
  document.addEventListener('click', e => { if (arrastro && e.isTrusted) { e.stopPropagation(); e.preventDefault(); } }, true);
})();

async function submitAuth(f) {
  const fd = new FormData(f);
  const user = String(fd.get('user') || '').trim().toLowerCase(), pass = String(fd.get('pass') || '');
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  try {
    if (S.authMode !== 'login') {
      await callFn({ accion: 'registrar', rol: S.authMode === 'trainer' ? 'profe' : 'alumno', usuario: user,
        nombre: String(fd.get('name') || '').trim(), password: pass, codigo: String(fd.get('code') || '').trim() }, false);
    }
    const { data, error } = await sb.auth.signInWithPassword({ email: userEmail(user), password: pass });
    if (error) throw error;
    await boot(data.user);
  } catch (e) { handleErr(e); }
  finally { btn.disabled = false; }
}
// Trae todos los ejercicios de a 1000: el servidor devuelve como máximo 1000 filas por pedido.
async function fetchExercises() {
  const all = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from('exercises').select('*').order('name').order('id').range(from, from + 999);
    if (error) return { data: null, error };
    all.push(...data);
    if (data.length < 1000) return { data: all, error: null };
  }
}
async function loadTrainerCache() {
  const [ex, st] = await Promise.all([
    fetchExercises(),
    sb.from('profiles').select('*').eq('role', 'student').eq('trainer_id', S.user.id).order('full_name')
  ]);
  if (ex.error) throw ex.error; if (st.error) throw st.error;
  S.c.exercises = ex.data; S.c.students = st.data;
}
async function refreshExercises() {
  const { data, error } = await fetchExercises();
  if (error) throw error; S.c.exercises = data;
}
async function boot(user) {
  try {
    const { data: p, error } = await sb.from('profiles').select('*').eq('id', user.id).single();
    if (error) throw error;
    S.user = user; S.profile = p; S.nav = []; S.authMsg = '';
    if (p.role === 'trainer') { await loadTrainerCache(); await open({ name: 'students', tab: 'students' }, false); }
    else await open({ name: 'routine', tab: 'routine' }, false);
  } catch (e) { handleErr(e); await sb.auth.signOut(); S.user = null; S.profile = null; render(false); }
}

    html += `<div class="chips">${days.map((d, i) => `<button class="${i === di ? 'on' : ''}" data-act="selDay" data-i="${i}"><span>${esc(d.name)}</span></button>`).join('')}</div>`;
    if (items.length) html += `<div class="muted small" id="progTxt">${done} de ${items.length} ejercicios hechos hoy</div><div class="bar"><i id="progBar" style="width:${Math.round(done / items.length * 100)}%"></i></div>`;
    html += items.map((it, i) => sItem(it, i, ex[it.exercise_id], logs[it.id], r)).join('') || '<div class="empty">Este día no tiene ejercicios.</div>';
    return html;
  },
  history() {
    return `<h2 style="margin-top:4px">Tus entrenamientos</h2>${sessionsHtml(S.d.logs || [], 30)}`;
  },
  account() { return accountView(); }
};
function sItem(it, idx, ex, log, r) {
  const done = !!(log && log.done);
  const bits = [];
  if (it.sets || it.reps) bits.push(`${it.sets == null ? '–' : it.sets} × ${esc(it.reps || '–')}`);
  if (it.weight) bits.push(esc(it.weight));
  if (it.rest_seconds) bits.push(`desc. ${it.rest_seconds}s`);
  return `<div class="ex ${done ? 'done' : ''}"><div class="exh"><b>${idx + 1}. ${esc(ex ? ex.name : 'Ejercicio')}</b>${done ? '<span class="badge">✓ Hecho</span>' : ''}</div>
    <div class="presc">${bits.join(' · ')}</div>
    ${it.notes ? `<div class="inote">${esc(it.notes)}</div>` : ''}
    ${videoBlock(ex && ex.video_url)}
    ${ex && ex.instructions ? `<details><summary>Cómo se hace</summary><p>${nl2br(ex.instructions)}</p></details>` : ''}
    <div class="log" data-item="${it.id}">
      <label class="chk"><input type="checkbox" data-chg="log" ${done ? 'checked' : ''}> Hecho</label>
      <input type="text" data-chg="log" data-f="weight" placeholder="Peso usado" value="${esc((log && log.weight_used) || '')}">
      <input type="text" data-chg="log" data-f="reps" placeholder="Reps hechas" value="${esc((log && log.reps_done) || '')}">
    </div>
    <button class="link" data-act="thread" data-routine="${r.id}" data-item="${it.id}" data-title="${esc(ex ? ex.name : 'Ejercicio')}">${ic('msg', 16)} Consultar a mi profe</button></div>`;
}

async function rpcAssign(routineId, studentId, name) {

async function addItemToDay(dayId, exId) {
  const day = S.d.routine.routine_days.find(d => d.id === dayId);
  const pos = Math.max(-1, ...day.routine_items.map(i => i.position || 0)) + 1;
  const { error } = await sb.from('routine_items').insert({ day_id: dayId, exercise_id: exId, position: pos, sets: 3, reps: '10', rest_seconds: 60 });
  if (error) throw error; await reload();
}
async function reorder(table, list, id, dir) {
  const arr = [...list].sort(byPos);
  const i = arr.findIndex(x => x.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  const ups = [];
  arr.forEach((x, k) => { if (x.position !== k) ups.push(sb.from(table).update({ position: k }).eq('id', x.id)); });
  const rs = await Promise.all(ups);
  for (const r of rs) if (r.error) throw r.error;
  await reload();
}

const CHG = {

  },
  async routineActive(el) {

    r.active = el.checked; toast(el.checked ? 'Rutina activa' : 'Rutina archivada');
  },
  async day(el) {
    const r = S.d.routine; if (!r) return;
    const v = el.value.trim() || 'Día';
    const { error } = await sb.from('routine_days').update({ name: v }).eq('id', el.dataset.id); if (error) throw error;
    const d = r.routine_days.find(x => x.id === el.dataset.id); if (d) d.name = v; flash(el);
  },
  async item(el) {
    const r = S.d.routine; if (!r) return;
    const f = el.dataset.f; let v = el.value.trim();
    if (f === 'sets' || f === 'rest_seconds') v = v === '' ? null : parseInt(v, 10);
    else if (v === '') v = null;
    const { error } = await sb.from('routine_items').update({ [f]: v }).eq('id', el.dataset.id); if (error) throw error;
    const it = findItem(el.dataset.id, r); if (it) it[f] = v; flash(el);
  },
  async myName(el) {
    const v = el.value.trim(); if (!v) { el.value = S.profile.full_name; return; }
    const { error } = await sb.from('profiles').update({ full_name: v }).eq('id', S.user.id); if (error) throw error;
    S.profile.full_name = v; toast('Nombre guardado');
  },
  selRoutine(el) { S.d.rIdx = +el.value; S.d.dayIdx = 0; render(true); },
  async log(el) {
    const card = el.closest('.log'), itemId = card.dataset.item;
    const chk = card.querySelector('input[type=checkbox]');
    const weight = card.querySelector('[data-f=weight]').value.trim(), reps = card.querySelector('[data-f=reps]').value.trim();
    let done = chk.checked;
    if (el !== chk && (weight || reps)) done = true;
    const row = { student_id: S.user.id, item_id: itemId, performed_on: today(), done, weight_used: weight || null, reps_done: reps || null };
    const { error } = await sb.from('workout_logs').upsert(row, { onConflict: 'student_id,item_id,performed_on' });
    if (error) throw error;
    const logs = S.d.logs || (S.d.logs = []);
    const i = logs.findIndex(l => l.item_id === itemId);
    if (i >= 0) Object.assign(logs[i], row); else logs.push(row);
    /* actualizo solo la tarjeta (sin redibujar todo) para no perder el foco al pasar de un campo a otro */
    chk.checked = done;
    const exEl = card.closest('.ex');
    if (exEl) {
      exEl.classList.toggle('done', done);
      const head = exEl.querySelector('.exh'), badge = head.querySelector('.badge');
      if (done && !badge) head.insertAdjacentHTML('beforeend', '<span class="badge">✓ Hecho</span>');
      if (!done && badge) badge.remove();
    }
    refreshProgress();
  }
};
function refreshProgress() {
  const rs = S.d.routines || []; if (!rs.length) return;
  const r = rs[Math.min(S.d.rIdx || 0, rs.length - 1)];
  const days = [...r.routine_days].sort(byPos); if (!days.length) return;
  const items = days[Math.min(S.d.dayIdx || 0, days.length - 1)].routine_items;
  const logs = {}; (S.d.logs || []).forEach(l => { logs[l.item_id] = l; });
  const done = items.filter(it => logs[it.id] && logs[it.id].done).length;
  const txt = document.getElementById('progTxt'), bar = document.getElementById('progBar');
  if (txt) txt.textContent = `${done} de ${items.length} ejercicios hechos hoy`;
  if (bar) bar.style.width = (items.length ? Math.round(done / items.length * 100) : 0) + '%';
}

  },
  prompt(f) {
    const v = String(new FormData(f).get('v') || '').trim();
    const r = S.modal.res; S.modal = null; renderModal(); r(v || null);
  },
  async exercise(f) {
    const fd = new FormData(f);
    const row = { name: String(fd.get('name')).trim(), muscle_group: String(fd.get('group')).trim() || null, video_url: String(fd.get('video')).trim() || null, instructions: String(fd.get('instr')).trim() || null };
    if (row.video_url && !/^https?:\/\//i.test(row.video_url)) { toast('El link del video tiene que empezar con http', true); return; }
    const ex = S.modal.ex, thenDay = S.modal.thenDay;
    let saved;
    if (ex) { const { data, error } = await sb.from('exercises').update(row).eq('id', ex.id).select().single(); if (error) throw error; saved = data; }
    else { const { data, error } = await sb.from('exercises').insert(Object.assign({ trainer_id: S.user.id }, row)).select().single(); if (error) throw error; saved = data; }
    S.modal = null; renderModal();
    await refreshExercises();
    if (thenDay && S.view.name === 'routine') await addItemToDay(thenDay, saved.id);
    else await reload();
    toast('Ejercicio guardado');
  },
  async comment(f) {
    const body = String(new FormData(f).get('body') || '').trim(); if (!body) return;
    const c = S.modal.ctx;
    const { error } = await sb.from('comments').insert({ student_id: c.studentId, routine_id: c.routineId, item_id: c.itemId || null, author_id: S.user.id, body });
    if (error) throw error;
    await loadThread();
  }
};

/* ===== EVENTOS ===== */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  try { await fn(el, e); } catch (err) { handleErr(err); }
});
document.addEventListener('change', async e => {
  const el = e.target.closest('[data-chg]'); if (!el) return;
  const fn = CHG[el.dataset.chg]; if (!fn) return;
  try { await fn(el); } catch (err) { handleErr(err); }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const btn = f.querySelector('button[type=submit]'); if (btn) btn.disabled = true;
  try { await FORMS[f.dataset.form](f); } catch (err) { handleErr(err); }
  finally { if (btn) btn.disabled = false; }
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.search) return;
  const q = el.value.trim().toLowerCase(), box = document.querySelector(el.dataset.search); if (!box) return;
  box.querySelectorAll('[data-name]').forEach(n => { n.style.display = n.dataset.name.indexOf(q) >= 0 ? '' : 'none'; });
});

/* ===== INICIO ===== */
async function init() {
  sb.auth.onAuthStateChange((ev) => {
    if (ev === 'SIGNED_OUT') { setTimeout(() => { S.user = null; S.profile = null; S.view = null; S.nav = []; S.modal = null; renderModal(); render(false); }, 0); }
  });
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) await boot(session.user); else render(false);
  } catch (e) { handleErr(e); render(false); }
}
init();
})();
</script>
